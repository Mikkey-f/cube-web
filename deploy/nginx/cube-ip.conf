# 裸 IP 的 HTTPS 站点：shortlived IP 证书（6 天期，acme.sh 自动续）
# default_server：无 SNI / SNI=IP 的请求走这里，域名请求仍走 cube.conf
server {
    listen 443 ssl default_server;
    server_name 47.108.90.207;

    ssl_certificate     /opt/cube/ssl/ip-fullchain.pem;
    ssl_certificate_key /opt/cube/ssl/ip-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /opt/cube/web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 背景音乐 / 封面 / 歌词：静态文件服务，支持 Range（拖动进度条）。
    # ⚠️ 必须是 ^~：否则下面的图片正则 location 会把 /music/xxx.png 抢走 → 404。
    location ^~ /music/ {
        alias /opt/cube/music/;
        add_header Accept-Ranges bytes;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* .*\.(js|css|woff2|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    access_log /www/wwwlogs/cube-ip-ssl.log;
}
