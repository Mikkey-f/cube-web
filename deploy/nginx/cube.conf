# cubelab.ink HTTPS 站点（备案通过 + 安全组放行 443 后自动生效）
server {
    listen 80;
    server_name cubelab.ink www.cubelab.ink;
    return 301 https://cubelab.ink$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cubelab.ink www.cubelab.ink;

    ssl_certificate     /opt/cube/ssl/fullchain.pem;
    ssl_certificate_key /opt/cube/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /opt/cube/web;
    index index.html;

    # 压缩：comp_level 6 比默认 1 压得深很多（JS 再省 10~15%）；
    # gzip_vary 让中间层按 Accept-Encoding 分开缓存，避免把压缩体发给不支持的客户端
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 背景音乐 / 封面 / 歌词：静态文件服务，支持 Range（拖动进度条）。
    # ⚠️ 必须是 ^~：否则下面那条 `location ~* \.(png|jpg|...)$` 正则优先级更高，
    # 会把 /music/xxx.png 抢走并按站点 root 去找 → 404（封面不显示的根因）。
    location ^~ /music/ {
        alias /opt/cube/music/;
        add_header Accept-Ranges bytes;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 构建产物：Vite 给文件名带内容哈希（index-RO0KXcqC.js），
    # 内容一变文件名就变、URL 也跟着变，所以可以放心一年强缓存 + immutable。
    # 回访时这些请求连 304 都不发，直接从本地缓存取。
    # ⚠️ 必须是 ^~：否则会被下面 `\.(js|css|...)$` 那条正则抢走，拿不到 immutable。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 25m;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # 入口 HTML 必须每次向服务器确认：它决定去加载哪个哈希文件，
        # 被缓存住就会出现「新版本已上线、用户还在跑旧 index」。
        add_header Cache-Control "no-cache";
    }

    location ~* .*\.(js|css|woff2|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
    }

    access_log /www/wwwlogs/cube-ssl.log;
    error_log  /www/wwwlogs/cube-ssl.error.log;
}
