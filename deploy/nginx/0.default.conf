server
{
    listen 80;
    server_name _;
    index index.html;
    root /opt/cube/web;

    # 压缩：comp_level 6 比默认 1 压得深很多（JS 再省 10~15%）；
    # gzip_vary 让中间层按 Accept-Encoding 分开缓存
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 25m;
    }

    # 背景音乐 / 封面 / 歌词：静态文件服务，支持 Range（拖动进度条）。
    # ⚠️ 必须是 ^~：否则下面的图片正则 location 会把 /music/xxx.png 抢走 → 404。
    location ^~ /music/ {
        alias /opt/cube/music/;
        add_header Accept-Ranges bytes;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 构建产物文件名自带内容哈希 ⇒ 一年强缓存 + immutable（详见 cube.conf 里的说明）
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # 入口 HTML 每次回源校验，避免新旧 index 错配
        add_header Cache-Control "no-cache";
    }

    location ~* .*\.(js|css|woff2|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
    }

    access_log /www/wwwlogs/cube-web.log;
    error_log  /www/wwwlogs/cube-web.error.log;
}
